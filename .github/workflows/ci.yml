name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          # Pinned: an unpinned ruff auto-updates and its default rule set drifts
          # (0.16 began flagging I001/S110/BLE001 the project never opted into),
          # breaking CI for unrelated changes. Bump deliberately.
          pip install ruff==0.15.20
          ruff check server/ clients/ --ignore E501

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy server/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        run: |
          pip install pytest
          pytest server/ -v --tb=short
        # ⚠️  Add any required env vars as GitHub Secrets and reference here:
        # env:
        #   TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  flutter-analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosic/flutter-action@v2

      - name: Get dependencies
        run: flutter pub get
        working-directory: clients/gajala

      - name: Analyze
        run: flutter analyze
        working-directory: clients/gajala
